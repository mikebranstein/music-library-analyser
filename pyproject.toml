[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[project]
name = "music-library-analyser"
version = "0.1.0"
description = "Analyze concert band PDF libraries for completeness and quality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pymupdf>=1.24.7",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.8.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "PyYAML>=6.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
